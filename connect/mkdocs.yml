# Per-module docs config, aggregated by root mkdocs.yml via mkdocs-monorepo-plugin.
site_name: Core
nav:
  # Repository-wide release history. It lives here, rather than in the root
  # docs/, so that connect_book can serve it inside Odoo: the Book reads a
  # module's own docs/ folder and never the repository root, which does not
  # ship when a module is installed from the Apps Store.
  - Changelog: changelog.md
  - Admin Guide:
      - Installation: admin/installation.md
      - Licensing & Trial: admin/licensing.md
      - Core Configuration: admin/core-setup.md
      - Security: admin/security.md
  - User Guide:
      - Getting Started: user/getting-started.md
      - Making and Receiving Calls: user/calls.md
      - Messages (SMS & WhatsApp): user/messages.md
      - Recordings & Transcriptions: user/recordings.md
      - Call Flows (IVR): user/callflows.md
      - Calls and Business Records: user/business-records.md
      - AI Voice Agents: user/ai-agents.md
