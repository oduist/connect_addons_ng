[options]
addons_path = /mnt/extra-addons
list_db = False
max_cron_threads = 1
limit_time_cpu = 600
limit_time_real = 1200
db_maxconn=16
workers=0
# Odoo 20 changed the default http_interface to 127.0.0.1; inside Docker the
# server must bind all interfaces or the reverse proxy cannot reach it.
# Odoo <= 19 already binds all interfaces, so this is a no-op there.
http_interface = 0.0.0.0
