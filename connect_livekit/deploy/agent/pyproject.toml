[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connect-livekit-agent"
version = "1.0.0"
description = "LiveKit voice-AI agent + egress uploader sidecar for Oduist Connect, configured from Odoo"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "livekit-agents>=1.0",
    "livekit-plugins-openai>=1.0",
    "livekit-plugins-deepgram>=1.0",
    "livekit-plugins-elevenlabs>=1.0",
    "livekit-plugins-silero>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
connect-livekit-agent = "connect_livekit_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
