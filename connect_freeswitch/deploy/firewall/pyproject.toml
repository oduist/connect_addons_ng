[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connect-firewall-service"
version = "1.0.9"
description = "FreeSWITCH SIP brute-force protection service, managed from Odoo"
requires-python = ">=3.12"
dependencies = [
    "aio-odoorpc>=2.0",
    "click>=8.1",
    "fastapi>=0.110",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn>=0.27",
]

[project.scripts]
connect-firewall-service = "connect_firewall_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
