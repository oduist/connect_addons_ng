# Traefik dynamic configuration: route HTTPS control-plane traffic to the
# host-networked FreeSWITCH and firewall services.
#
# mod_xml_rpc has no native TLS, so Traefik terminates HTTPS here (the cert is
# issued by the letsencrypt resolver configured on the websecure entrypoint,
# see docker-compose.yml) and proxies to the internal plain-HTTP port (8080) on
# the host where FreeSWITCH runs (network_mode: host).
#
# HTTP Basic Auth is still enforced by mod_xml_rpc itself; Traefik only adds the
# TLS layer that keeps the credential off the wire in cleartext.

http:
  routers:
    freeswitch-xmlrpc:
      rule: "PathPrefix(`/RPC2`)"
      entryPoints:
        - websecure
      service: freeswitch-xmlrpc
      tls: {}
    firewall:
      rule: "PathPrefix(`/firewall`)"
      entryPoints:
        - websecure
      service: firewall
      tls: {}

  services:
    freeswitch-xmlrpc:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8080"
    firewall:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8081"
