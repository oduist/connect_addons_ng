server {
    listen 8080;

    # Odoo always uses TLS to this proxy.  The proxy is the sole public route
    # to FreeSWITCH's HTTP-only mod_xml_rpc listener on the host network.
    location = /RPC2 {
        proxy_pass http://172.17.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }
}
