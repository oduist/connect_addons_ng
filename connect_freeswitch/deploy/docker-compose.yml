services:
  odoo:
    image: odoo:19.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    restart: unless-stopped
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - ODOO_HTTP_SOCKET_TIMEOUT=20
    volumes:
      - odoo-data:/var/lib/odoo
      - ../..:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf
    command: odoo -d connect_fs_19 --dev=xml --workers=2


  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - postgres-data:/var/lib/postgresql/data

  fs:
    image: safarov/freeswitch:latest
    container_name: freeswitch
    hostname: freeswitch
    network_mode: host
    restart: unless-stopped
    environment:
      - SOUND_RATES=8000:16000
      - SOUND_TYPES=music:en-us-callie
      - EPMD=false
      - DUMPCAP=false
      - ODOO_URL=${ODOO_URL}
      # Shared secret for FreeSWITCH -> Odoo HTTP calls; must match the
      # FreeSWITCH Webhook Token in Odoo settings (ADR-025).
      - FS_WEBHOOK_TOKEN=${FS_WEBHOOK_TOKEN}
    volumes:
      - freeswitch-sounds:/usr/share/freeswitch/sounds
      - ./freeswitch/conf:/etc/freeswitch
      - ./freeswitch/logs:/var/log/freeswitch
      - ./freeswitch/dumpcap:/dumpcap

volumes:
  freeswitch-sounds:
  odoo-data:
  postgres-data:
