site_name: Oduist Connect Documentation
site_description: Telephony integration platform for Odoo
# Deliberately left without a path: the repository name is an implementation
# detail and should not show up in the home page's address. MkDocs links every
# page relatively, so the built site works from whatever prefix it is served
# under; site_url only drives the `mkdocs serve` mount point, <link
# rel="canonical"> and sitemap.xml. Set this to the real address once the docs
# get a domain of their own.
site_url: ""
copyright: Copyright &copy; Oduist OÜ

docs_dir: docs

# Internal design notes kept in the repo but not part of the published site.
exclude_docs: |
  superpowers/

theme:
  name: material
  custom_dir: docs/overrides
  # Site logo (header) and browser favicon — the shared Oduist Connect icon.
  logo: assets/logo.png
  favicon: assets/logo.png
  # Dark ("slate") is the default scheme (the brand site is dark-only); light
  # stays available via the header toggle. Actual colors come from the "Aurora"
  # brand palette in stylesheets/aurora.css via the --md-* custom properties.
  # primary/accent are "custom" on purpose: Material's built-in palettes ship
  # rules like [data-md-color-scheme=slate][data-md-color-primary=indigo] that
  # outrank our single-attribute overrides. "custom" carries no colors of its
  # own, so aurora.css owns every --md-* value.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: Geist
    code: Geist Mono
  features:
    - navigation.sections
    # Breadcrumbs above the page title (Home / Twilio / ...). Every crumb is a
    # link: a section resolves to its first page, so the trail is walkable all
    # the way back to Home — which is how readers reach other modules, since
    # the sidebar is scoped to the current one (docs/overrides/partials/nav.html).
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/aurora.css
  - stylesheets/module-table.css

extra_javascript:
  - javascripts/module-table.js
  - javascripts/hero-zoom.js

# Documentation lives inside each Odoo module under <module>/docs/. The
# mkdocs-monorepo-plugin aggregates every module's own mkdocs.yml (site_name +
# nav) into this single site via the '!include' directives below. Only the
# shared Home page and assets stay in the root docs/ directory.
plugins:
  - search
  - monorepo

nav:
  - Home: index.md
  - Changelog: changelog.md
  - Core: '!include ./connect/mkdocs.yml'
  - Twilio: '!include ./connect_twilio/mkdocs.yml'
  - FreeSWITCH: '!include ./connect_freeswitch/mkdocs.yml'
  - FreeSWITCH Website: '!include ./connect_freeswitch_website/mkdocs.yml'
  - Vonage: '!include ./connect_vonage/mkdocs.yml'
  - Pipecat: '!include ./connect_pipecat/mkdocs.yml'
  - Asterisk: '!include ./connect_asterisk/mkdocs.yml'
  - Telnyx: '!include ./connect_telnyx/mkdocs.yml'
  - 3CX: '!include ./connect_3cx/mkdocs.yml'
  - LiveKit: '!include ./connect_livekit/mkdocs.yml'
  - Infobip: '!include ./connect_infobip/mkdocs.yml'
  - Dograh: '!include ./connect_dograh/mkdocs.yml'
  - Bird: '!include ./connect_bird/mkdocs.yml'
  - Customer Memory: '!include ./connect_memory/mkdocs.yml'
  - Memory Sales: '!include ./connect_memory_sale/mkdocs.yml'
  - ElevenLabs: '!include ./connect_elevenlabs/mkdocs.yml'
  - ElevenLabs Helpdesk: '!include ./connect_elevenlabs_helpdesk/mkdocs.yml'
  - ElevenLabs Knowledge: '!include ./connect_elevenlabs_knowledge/mkdocs.yml'
  - ElevenLabs Sales: '!include ./connect_elevenlabs_sale/mkdocs.yml'
  - CRM: '!include ./connect_crm/mkdocs.yml'
  - CRM Twilio Bridge: '!include ./connect_crm_twilio/mkdocs.yml'
  - Helpdesk: '!include ./connect_helpdesk/mkdocs.yml'
  - HR: '!include ./connect_hr/mkdocs.yml'
  - Sales: '!include ./connect_sale/mkdocs.yml'
  - Accounting: '!include ./connect_account/mkdocs.yml'
  - Project: '!include ./connect_project/mkdocs.yml'

extra:
  # Remove the "Made with Material for MkDocs" footer notice.
  generator: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
