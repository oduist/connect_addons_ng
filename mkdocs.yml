site_name: Oduist Connect Documentation
site_description: Telephony integration platform for Odoo
# Deliberately left without a path: the repository name is an implementation
# detail and should not show up in the home page's address. MkDocs links every
# page relatively, so the built site works from whatever prefix it is served
# under; site_url only drives the `mkdocs serve` mount point, <link
# rel="canonical"> and sitemap.xml. Set this to the real address once the docs
# get a domain of their own.
site_url: ""
# Drives the "Edit on GitHub" link. Aggregated pages live in a temporary
# docs_dir, so a naive edit_url would point at a path that does not exist in
# the repository; mkdocs-monorepo-plugin rewrites it back to the owning module
# (mkdocs_monorepo_plugin/edit_uri.py). That rewrite does a plain string
# replace of this root docs_dir ("docs") inside edit_uri with each module's
# own docs_dir ("connect_twilio/docs", ...), so edit_uri MUST literally
# contain "docs/" as a path segment — "edit/19.0/" alone silently fails to
# match and every module page falls back to the un-rewritten root edit_uri.
repo_url: https://github.com/oduist/connect_addons_ng
edit_uri: edit/18.0/docs/
copyright: Copyright &copy; Oduist OÜ

docs_dir: docs

# README.md documents this build for contributors and conflicts with
# index.md (the actual Home page)
# in the same directory if MkDocs tries to build both. exclude_docs compiles
# to a gitignore-style spec (mkdocs/structure/files.py:529), where a bare
# pattern matches at any depth in the aggregated tree; the leading slash
# anchors this entry to the root docs_dir so it does NOT also swallow a
# future module's own docs/README.md.
exclude_docs: |
  /README.md

theme:
  # Aurora lives in its own repository and installs from docs/requirements.txt;
  # MkDocs resolves this name through the package's mkdocs.themes entry point.
  name: aurora
  # Both files ship with the theme, which also carries the home page kit this
  # site's index.md is written against.
  logo: assets/img/logo.png
  favicon: assets/img/logo.png

# Documentation lives inside each Odoo module under <module>/docs/. The
# mkdocs-monorepo-plugin aggregates every module's own mkdocs.yml (site_name +
# nav) into this single site via the '!include' directives below. Only the
# shared Home page and assets stay in the root docs/ directory.
plugins:
  - search
  - monorepo

nav:
  - Home: index.md
  - Changelog: changelog.md
  - Core: '!include ./connect/mkdocs.yml'
  - Twilio: '!include ./connect_twilio/mkdocs.yml'
  - FreeSWITCH: '!include ./connect_freeswitch/mkdocs.yml'
  - FreeSWITCH Website: '!include ./connect_freeswitch_website/mkdocs.yml'
  - Vonage: '!include ./connect_vonage/mkdocs.yml'
  - Pipecat: '!include ./connect_pipecat/mkdocs.yml'
  - Asterisk: '!include ./connect_asterisk/mkdocs.yml'
  - Telnyx: '!include ./connect_telnyx/mkdocs.yml'
  - 3CX: '!include ./connect_3cx/mkdocs.yml'
  - LiveKit: '!include ./connect_livekit/mkdocs.yml'
  - Infobip: '!include ./connect_infobip/mkdocs.yml'
  - Dograh: '!include ./connect_dograh/mkdocs.yml'
  - Bird: '!include ./connect_bird/mkdocs.yml'
  - ElevenLabs: '!include ./connect_elevenlabs/mkdocs.yml'
  - ElevenLabs Helpdesk: '!include ./connect_elevenlabs_helpdesk/mkdocs.yml'
  - ElevenLabs Knowledge: '!include ./connect_elevenlabs_knowledge/mkdocs.yml'
  - ElevenLabs Sales: '!include ./connect_elevenlabs_sale/mkdocs.yml'
  - CRM: '!include ./connect_crm/mkdocs.yml'
  - CRM Twilio Bridge: '!include ./connect_crm_twilio/mkdocs.yml'
  - Helpdesk: '!include ./connect_helpdesk/mkdocs.yml'
  - Book: '!include ./connect_book/mkdocs.yml'

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
