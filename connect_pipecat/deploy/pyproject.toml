[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connect-pipecat-service"
version = "1.0.0"
description = "Pipecat voice agent sidecar for Oduist Connect"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pipecat-ai[anthropic,deepgram,elevenlabs,openai,silero,websocket]==1.5.0",
    "pydantic-settings>=2.7",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
connect-pipecat-service = "connect_pipecat_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
